name: Build and deploy container app to Azure Container Apps - suldee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_EB7837A1237A4F3CB84C37FFDA664B7E }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_9A4ED13CBD3C478CAA68B94FE5AD8842 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1E2E1C3FC5BA440A8B794A81532CDADD }}

      - name: Build and push container image via ACR
        run: |
          az acr build \
            --registry cacf50a6c37facr \
            --resource-group rg-big2-prod \
            --image suldee:${{ github.sha }} \
            --image suldee:latest \
            .

      - name: Deploy update to Azure Container Apps
        run: |
          az containerapp update \
            --name suldee \
            --resource-group rg-suldee-prod \
            --image cacf50a6c37facr.azurecr.io/suldee:${{ github.sha }}